apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20"
    classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.1.20"
  }
}

group = 'com.emmy.morsewedavideoeditor'
version = '0.1.0'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "com.emmy.morsewedavideoeditor"
  compileSdk safeExtGet('compileSdkVersion', 36)

  defaultConfig {
    minSdk safeExtGet('minSdkVersion', 24)
    targetSdk safeExtGet('targetSdkVersion', 36)
    versionCode 1
    versionName "0.1.0"
  }

  buildFeatures {
    compose true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
    freeCompilerArgs += [
        '-Xskip-metadata-version-check'
    ]
  }
}

dependencies {
  implementation project(':expo-modules-core')

  // Compose dependencies for hosting the KMP shared UI.
  implementation 'androidx.compose.foundation:foundation-android:1.10.6'
  implementation 'androidx.compose.ui:ui-android:1.10.6'
  implementation 'androidx.compose.material3:material3-android:1.5.0-alpha17'
  implementation 'androidx.activity:activity-compose:1.10.1'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'

  // Morse Weda shared library and native engine.
  // When this module is consumed inside the MorseWeda repo, prefer the local project
  // dependencies so the example app picks up code changes without rebuilding AARs.
  if (findProject(':app:shared') != null && findProject(':sdk:native') != null) {
    implementation project(':app:shared')
    implementation project(':sdk:native')
  } else {
    implementation files('libs/shared-release.aar')
    implementation files('libs/native-release.aar')
  }
}
